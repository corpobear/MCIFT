[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcift"
dynamic = ["version"]
description = "Deterministic multichannel anomaly-detection and condition-monitoring research toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Martin Kasala" }]
dependencies = ["numpy>=1.26"]
keywords = [
  "anomaly-detection",
  "condition-monitoring",
  "predictive-maintenance",
  "signal-processing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/corpobear/MCIFT"
Repository = "https://github.com/corpobear/MCIFT"
Issues = "https://github.com/corpobear/MCIFT/issues"

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "mypy==1.17.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
  "twine==6.1.0",
]
security = [
  "bandit==1.8.6",
  "pip-audit==2.9.0",
]

[tool.setuptools.dynamic]
version = { attr = "mcift._version.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["mcift.experimental*"]

[tool.setuptools.package-data]
mcift = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mcift"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["mcift"]
mypy_path = "src"
