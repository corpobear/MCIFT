name: Public release check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: Verify exact commit without publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev,security]"
      - run: ruff check .
      - run: mypy src
      - run: python tools/check_markdown_links.py
      - run: pytest -q
      - run: pytest -q --cov=mcift --cov-report=term-missing
      - run: bandit -q -r src/mcift
      - run: pip-audit
      - run: python -m build
      - run: twine check dist/*
      - name: Inspect complete artifact contents
        run: python tools/inspect_release_artifacts.py
      - name: Installed wheel six-gate and schema-4 smoke
        run: |
          python -m venv --system-site-packages wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" -I - <<'PY'
          import tempfile
          from pathlib import Path

          import numpy as np

          import mcift
          from mcift import MCIFTHistory, MCIFTMonitor
          from mcift.profiles import IMS_SIX_GATE_PROFILE_ID, VIBRATION_PROFILE_ID

          assert mcift.__version__ == "0.1.0a1"
          rng = np.random.default_rng(20260101)
          monitor = MCIFTMonitor.fit(
              rng.normal(size=(8, 32, 2)),
              sampling_rate_hz=20_000.0,
              channel_names=["bearing_1", "bearing_2"],
              profile=VIBRATION_PROFILE_ID,
              gate_profile=IMS_SIX_GATE_PROFILE_ID,
          ).calibrate(
              rng.normal(size=(20, 32, 2)),
              sequence_order="chronological",
          )
          result, history = monitor.evaluate_with_history(
              rng.normal(size=(32, 2)),
              history=MCIFTHistory(maxlen=32),
              sequence_index=0,
          )
          assert result.confidence_evidence["decision_profile"] == IMS_SIX_GATE_PROFILE_ID
          assert len(history.entries) == 1
          with tempfile.TemporaryDirectory() as temporary:
              path = Path(temporary) / "alpha.mcift"
              monitor.save(path)
              loaded = MCIFTMonitor.load(path)
              assert loaded.gate_profile == IMS_SIX_GATE_PROFILE_ID
              assert loaded.model_version == "0.1.0a1"
          PY
      - name: Installed sdist smoke
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install --upgrade pip
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          "$GITHUB_WORKSPACE/sdist-smoke/bin/python" -I -c "import mcift; from mcift import MCIFTHistory, MCIFTMonitor; assert mcift.__version__ == '0.1.0a1'; print(mcift.__version__, MCIFTMonitor.__name__, MCIFTHistory.__name__)"
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload reviewed artifacts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcift-0.1.0a1-release-check-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/audit-summary.txt
          if-no-files-found: error
          retention-days: 14
