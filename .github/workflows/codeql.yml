name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL / Python and GitHub Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4, pinned 2026-07-21
        with:
          languages: python
      - name: Analyze and upload
        if: github.event.repository.visibility == 'public' || vars.CODEQL_ENABLED == 'true'
        uses: github/codeql-action/analyze@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4, pinned 2026-07-21
        with:
          upload: always
      - name: Analyze without unavailable private-repository upload
        if: github.event.repository.visibility != 'public' && vars.CODEQL_ENABLED != 'true'
        uses: github/codeql-action/analyze@eec0bff2f6c15bf3f1e8a0152f94d17664a06a06 # v4, pinned 2026-07-21
        with:
          upload: never
