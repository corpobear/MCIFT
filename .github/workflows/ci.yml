name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-types:
    name: Lint and types / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"
      - run: ruff check .
      - run: mypy src
      - run: python tools/check_markdown_links.py
      - name: Validate PyPI publication workflow structure
        run: python -m pytest -q tests/security/test_publish_workflow.py

  unit-matrix:
    name: Unit / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2022
            python: "3.11"
          - os: windows-2022
            python: "3.13"
          - os: macos-14
            python: "3.11"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"
      - run: mypy src
      - run: pytest -q --junitxml=test-results.xml
      - name: Upload failing test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore

  minimum-numpy:
    name: Minimum NumPy / Python 3.11 / NumPy 1.26
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install "numpy==1.26.*"
      - run: python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python --version
          python -c "import numpy; assert numpy.__version__.startswith('1.26.'); print('NumPy', numpy.__version__)"
      - run: pytest -q --junitxml=test-results.xml
      - name: Upload failing test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-ubuntu-24.04-py3.11-numpy1.26
          path: test-results.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage / Ubuntu / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"
      - run: pytest -q --cov=mcift --cov-report=term-missing --cov-report=xml

  package:
    name: Package and installed artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - name: Runtime versions
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"
      - run: python -m build
      - run: twine check dist/*
      - name: Inspect complete artifact contents
        run: python tools/inspect_release_artifacts.py
      - name: Installed-wheel smoke test
        run: |
          python -m venv --system-site-packages wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" -I - <<'PY'
          import tempfile
          from pathlib import Path

          import numpy as np

          import mcift
          from mcift import MCIFTHistory, MCIFTMonitor
          from mcift.profiles import IMS_SIX_GATE_PROFILE_ID, VIBRATION_PROFILE_ID

          assert mcift.__version__ == "0.1.0a1"
          rng = np.random.default_rng(6006)
          monitor = MCIFTMonitor.fit(
              rng.normal(size=(8, 16, 2)),
              sampling_rate_hz=20_000.0,
              channel_names=["a", "b"],
              profile=VIBRATION_PROFILE_ID,
              gate_profile=IMS_SIX_GATE_PROFILE_ID,
          ).calibrate(
              rng.normal(size=(20, 16, 2)),
              sequence_order="chronological",
          )
          with tempfile.TemporaryDirectory() as temporary:
              path = Path(temporary) / "installed.mcift"
              monitor.save(path)
              loaded = MCIFTMonitor.load(path)
              assert loaded.gate_profile == IMS_SIX_GATE_PROFILE_ID
              assert loaded.conventional_rms_thresholds is not None
          print(mcift.__version__, MCIFTMonitor.__name__, MCIFTHistory.__name__)
          PY
      - name: Installed-sdist smoke test
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install --upgrade pip
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          "$GITHUB_WORKSPACE/sdist-smoke/bin/python" -I -c "import mcift; from mcift import MCIFTHistory, MCIFTMonitor; assert mcift.__version__ == '0.1.0a1'; print(mcift.__version__, MCIFTMonitor.__name__, MCIFTHistory.__name__)"

  security:
    name: Security tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[security]"
      - name: Runtime versions
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"
      - run: bandit -q -r src/mcift
      - run: pip-audit
