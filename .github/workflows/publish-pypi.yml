name: Publish to PyPI
run-name: Publish mcift 0.1.0a1 from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: publish-mcift-0.1.0a1
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify exact tagged source
    if: github.ref == 'refs/tags/v0.1.0a1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - name: Verify immutable release identity
        run: |
          test "$GITHUB_REF" = "refs/tags/v0.1.0a1"
          python -c "import mcift; assert mcift.__version__ == '0.1.0a1'"
      - run: python -m build
      - run: twine check dist/*
      - name: Inspect complete artifact contents
        run: python tools/inspect_release_artifacts.py
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcift-0.1.0a1-pypi-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload release audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcift-0.1.0a1-pypi-audit-${{ github.sha }}
          path: |
            dist/SHA256SUMS
            dist/audit-summary.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mcift
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcift-0.1.0a1-pypi-${{ github.sha }}
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1, pinned 2026-07-21
