name: Publish to PyPI
run-name: Publish mcift 0.1.0a1 from release ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

concurrency:
  group: publish-mcift-0.1.0a1
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify exact release tag
    if: github.event.release.tag_name == 'v0.1.0a1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools build
      - run: python -m pip install -e ".[dev,security]"
      - name: Verify immutable release identity
        run: |
          test "${{ github.event.release.tag_name }}" = "v0.1.0a1"
          test "$(git describe --tags --exact-match)" = "v0.1.0a1"
          python -c "import mcift; assert mcift.__version__ == '0.1.0a1'"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - run: pytest -q --cov=mcift --cov-report=term-missing
      - run: bandit -q -r src/mcift
      - run: pip-audit
      - run: python tools/check_markdown_links.py
      - name: Remove prior build output
        run: rm -rf dist build
      - run: python -m build
      - run: twine check dist/*
      - name: Inspect complete artifact contents
        run: python tools/inspect_release_artifacts.py
      - name: Verify distribution metadata
        run: python tools/verify_release_metadata.py
      - name: Installed wheel six-gate and schema-4 round trip
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --upgrade pip
          wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/wheel-smoke/bin/python" -I - <<'PY'
          import tempfile
          from pathlib import Path

          import numpy as np

          import mcift
          from mcift import MCIFTHistory, MCIFTMonitor
          from mcift.profiles import IMS_SIX_GATE_PROFILE_ID, VIBRATION_PROFILE_ID

          assert mcift.__version__ == "0.1.0a1"
          rng = np.random.default_rng(20260101)
          monitor = MCIFTMonitor.fit(
              rng.normal(size=(8, 32, 2)),
              sampling_rate_hz=20_000.0,
              channel_names=["bearing_1", "bearing_2"],
              profile=VIBRATION_PROFILE_ID,
              gate_profile=IMS_SIX_GATE_PROFILE_ID,
          ).calibrate(
              rng.normal(size=(20, 32, 2)),
              sequence_order="chronological",
          )
          window = rng.normal(size=(32, 2))
          before, before_history = monitor.evaluate_with_history(
              window,
              history=MCIFTHistory(maxlen=32),
              sequence_index=0,
          )
          with tempfile.TemporaryDirectory() as temporary:
              path = Path(temporary) / "alpha.mcift"
              monitor.save(path)
              loaded = MCIFTMonitor.load(path)
              after, after_history = loaded.evaluate_with_history(
                  window,
                  history=MCIFTHistory(maxlen=32),
                  sequence_index=0,
              )
          assert loaded.model_version == "0.1.0a1"
          assert loaded.gate_profile == IMS_SIX_GATE_PROFILE_ID
          assert len(before_history.entries) == len(after_history.entries) == 1
          np.testing.assert_allclose(before.exchange_matrix, after.exchange_matrix, rtol=0, atol=0)
          assert before.global_exchange_score == after.global_exchange_score
          assert [
              (gate.name, gate.available, gate.passed) for gate in before.gate_results
          ] == [
              (gate.name, gate.available, gate.passed) for gate in after.gate_results
          ]
          PY
      - name: Installed sdist smoke
        run: |
          python -m venv sdist-smoke
          sdist-smoke/bin/python -m pip install --upgrade pip
          sdist-smoke/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          "$GITHUB_WORKSPACE/sdist-smoke/bin/python" -I -c "import mcift; from mcift import MCIFTHistory, MCIFTMonitor; assert mcift.__version__ == '0.1.0a1'; print(mcift.__version__, MCIFTMonitor.__name__, MCIFTHistory.__name__)"
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload reviewed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcift-0.1.0a1-release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/audit-summary.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mcift/
    permissions:
      id-token: write
    steps:
      - name: Download reviewed release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcift-0.1.0a1-release-${{ github.sha }}
          path: reviewed
      - name: Verify reviewed artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("reviewed")
          members = sorted(path.name for path in root.iterdir())
          wheels = sorted(root.glob("mcift-0.1.0a1-*.whl"))
          sdists = sorted(root.glob("mcift-0.1.0a1.tar.gz"))
          assert len(wheels) == 1, members
          assert len(sdists) == 1, members
          expected = sorted(
              [wheels[0].name, sdists[0].name, "SHA256SUMS", "audit-summary.txt"]
          )
          assert members == expected, members
          assert all(path.is_file() for path in root.iterdir())
          PY
          cd reviewed
          sha256sum --check SHA256SUMS
          cd ..
          mkdir packages
          cp reviewed/*.whl reviewed/*.tar.gz packages/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: packages/
